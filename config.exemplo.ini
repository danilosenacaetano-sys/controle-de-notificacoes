; =====================================================================
;  Controle de Notificações — configuração do servidor
; =====================================================================
;  Copie este arquivo para "config.ini" e ajuste. O config.ini é da sua
;  instalação e NÃO vai para o repositório (está no .gitignore).
;  Linhas que começam com ";" são comentários. Depois de alterar,
;  desligue e ligue o servidor de novo.

[servidor]
; Nome da empresa: aparece no cabeçalho, nas telas e nos relatórios em Excel.
empresa = Minha Empresa

; Porta do endereço (ex.: http://192.168.0.10:8080).
; Troque se a porta 8080 já estiver em uso neste computador.
porta = 8080

; Onde ficam o banco de dados e os arquivos anexados (relativo a esta pasta, ou caminho completo).
pasta_dados = dados

; Onde ficam os backups automáticos.
pasta_backups = backups

; Uma SEGUNDA cópia de cada backup, fora deste computador (pasta de rede, NAS, HD externo).
; Exemplo: copia_extra_backup = \\servidor-arquivos\Backups\Notificacoes
copia_extra_backup =

; De quantas em quantas horas fazer backup automático.
backup_a_cada_horas = 24

; Quantos backups guardar (os mais antigos são apagados).
backups_manter = 30

; Abrir o navegador sozinho quando o servidor ligar (sim/nao).
abrir_navegador = sim

; Abrir o sistema numa janela própria, como um aplicativo (sim/nao).
modo_aplicativo = sim

[usuarios]
; Um usuário por linha:   login = Nome | Cargo
; Nenhuma senha fica aqui. Na primeira vez que o servidor liga, cada usuário novo recebe uma
; senha provisória, gravada em dados\PRIMEIRO-ACESSO.txt; no primeiro login a pessoa cria a sua.
admin = Administrador | Gestão
